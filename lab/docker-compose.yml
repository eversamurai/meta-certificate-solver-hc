# CertAgent lab: a private ACME CA (step-ca) and one nginx serving two sites.
#   demo.lab  -> https://localhost:8443   (env: lab,  agent may fix it)
#   shop.prod -> https://localhost:8444   (env: prod, agent must stop at policy)
#   accounts.lab -> https://localhost:8445 (env: lab, `break.sh hostname` serves a cert for the wrong name)
# The CA validates http-01 by fetching http://demo.lab/.well-known/acme-challenge/ on this network,
# which nginx serves from ./webroot. The agent writes challenge files into ./webroot on the host.
name: certagent-lab

services:
  ca:
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: CertAgent Lab CA
      DOCKER_STEPCA_INIT_DNS_NAMES: localhost,ca
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: admin
      DOCKER_STEPCA_INIT_ACME: "true"
      # Lab-only password. Without it the image generates a separate random password for the `admin`
      # provisioner and deletes it after init, so init.sh/break.sh could never issue certs with it.
      DOCKER_STEPCA_INIT_PASSWORD: certagent-lab
    ports:
      - "9000:9000"
    volumes:
      - ca-data:/home/step
    healthcheck:
      test: ["CMD", "step", "ca", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.30-alpine
    networks:
      default:
        aliases: [demo.lab, shop.prod, accounts.lab]
    ports:
      - "8080:80"
      - "8443:443"
      - "8444:8444"
      - "8445:8445"
    environment:
      OPENSSL_CONF: /etc/nginx/openssl-lab.cnf   # security level 0, so `break.sh weak` can serve RSA 1024
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/openssl-lab.cnf:/etc/nginx/openssl-lab.cnf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./webroot:/var/www/acme:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    depends_on:
      ca:
        condition: service_healthy

volumes:
  ca-data:
