events {}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Plain HTTP: ACME http-01 challenges only.
    server {
        listen 80;
        server_name demo.lab shop.prod;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }
        location / {
            return 200 "certagent lab (http)\n";
        }
    }

    # demo.lab — env: lab. The agent renews and installs server.crt/server.key.
    server {
        listen 443 ssl;
        server_name demo.lab;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        location / {
            default_type text/plain;
            return 200 "demo.lab OK\n";
        }
    }

    # shop.prod — env: prod. Policy denies changes; it exists to show the agent stopping.
    server {
        listen 8444 ssl;
        server_name shop.prod;
        ssl_certificate     /etc/nginx/certs/prod.crt;
        ssl_certificate_key /etc/nginx/certs/prod.key;
        location / {
            default_type text/plain;
            return 200 "shop.prod OK\n";
        }
    }
}
