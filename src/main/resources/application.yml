server:
  port: 8088

spring:
  application:
    name: cert-agent
  ai:
    # Only used when certagent.model=glimmer (local open weights).
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:muse-glimmer:30b}
          num-ctx: 8192        # thinking + case prompt + tool schemas don't fit Ollama's 4096 default
          temperature: 0.1

certagent:
  # Which model decides and calls the tools:
  #   spark   = Muse Spark on Meta Model API (default). Case prompts and tool results go to api.meta.ai;
  #             tools, policy, backups, verification and rollback still run on this machine.
  #   glimmer = Muse Glimmer through local Ollama. Nothing leaves the network (the open-weights setup).
  model: ${CERTAGENT_MODEL:spark}
  spark:
    api-key: ${MODEL_API_KEY:}   # put a local key in config/application.yml (git-ignored), never here
    base-url: https://api.meta.ai
    model: ${MUSE_SPARK_MODEL:muse-spark-1.3}
    reasoning-effort: low        # hidden thinking only; the `reasoning` tool argument is still written in full
    timeout: 120s                # per API call

  targets:
    - name: demo.lab
      host: localhost
      port: 8443
      sni: demo.lab
      env: lab
      cert-path: lab/certs/server.crt
      key-path: lab/certs/server.key
    - name: shop.prod
      host: localhost
      port: 8444
      sni: shop.prod
      env: prod
      cert-path: lab/certs/prod.crt
      key-path: lab/certs/prod.key
    - name: accounts.lab
      host: localhost
      port: 8445
      sni: accounts.lab
      env: lab
      cert-path: lab/certs/accounts.crt
      key-path: lab/certs/accounts.key

  policy:
    dry-run: false
    max-actions-per-run: 20   # counts verifies too; raised from 10 so cases 1 and 2 fit in one run
    environments:   # tool names in brackets: Spring drops "_" from bare map keys
      lab:
        "[verify_handshake]": ALLOW
        "[renew_certificate]": ALLOW
        "[rollback]": ALLOW
      prod:
        "[verify_handshake]": ALLOW
        "[renew_certificate]": DENY
        "[rollback]": DENY

  # The lab CA issues 24h certs, so the windows are in hours here, not the usual weeks.
  risk:
    warn-within: 6h
    critical-within: 30m
    min-rsa-bits: 2048

  acme:
    directory-url: https://localhost:9000/acme/acme/directory
    account-key: data/acme-account.pem
    webroot: lab/webroot

  trust:
    extra-roots:
      - lab/certs/root_ca.crt

  install:
    backup-dir: data/backups
    # nginx -t first: a bare `nginx -s reload` exits 0 even when nginx rejects the config.
    reload-command: [docker, compose, -f, lab/docker-compose.yml, exec, -T, nginx, sh, -c, "nginx -t -q && nginx -s reload"]

  notification:
    webhook-url: ${NOTIFY_WEBHOOK:}

  schedule:
    cron: "0 0 6 * * *"
    run-on-startup: true

  event-log: data/events.jsonl
