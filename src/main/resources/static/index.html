<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CertAgent Timeline</title>
<style>
  /* System fonts only: nothing leaves the network, not even a font request. */
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1b2330;
    --line: #2a3442;
    --text: #e6edf3;
    --muted: #8b98a8;
    --faint: #5c6878;
    --ok: #3fb950;
    --ok-bg: rgba(63, 185, 80, .12);
    --bad: #f85149;
    --bad-bg: rgba(248, 81, 73, .12);
    --warn: #d29922;
    --warn-bg: rgba(210, 153, 34, .14);
    --info: #58a6ff;
    --info-bg: rgba(88, 166, 255, .12);
    --violet: #bc8cff;
    --violet-bg: rgba(188, 140, 255, .14);
    --accent: #58a6ff;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --panel-2: #f3f5f8;
      --line: #d8dee4;
      --text: #1f2328;
      --muted: #59636e;
      --faint: #8c959f;
      --ok: #1a7f37;
      --ok-bg: rgba(26, 127, 55, .09);
      --bad: #cf222e;
      --bad-bg: rgba(207, 34, 46, .08);
      --warn: #9a6700;
      --warn-bg: rgba(154, 103, 0, .10);
      --info: #0969da;
      --info-bg: rgba(9, 105, 218, .08);
      --violet: #8250df;
      --violet-bg: rgba(130, 80, 223, .09);
      --accent: #0969da;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 var(--sans); }
  .mono { font-family: var(--mono); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---- top bar ---- */
  header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
  .brand svg { color: var(--ok); }
  .tagline { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.4s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  button.run {
    font: inherit; font-weight: 600; font-size: 14px; color: #fff; background: #238636; border: 1px solid rgba(240,246,252,.1);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
  }
  button.run:hover { background: #2ea043; }
  button.run:disabled { opacity: .55; cursor: default; }

  /* ---- pinned run summary ---- */
  .summary {
    margin: 20px 0 8px; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
  }
  .summary .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .summary .label .by { text-transform: none; letter-spacing: 0; margin-left: auto; }
  .summary p { margin: 8px 0 12px; font-size: 17px; line-height: 1.55; max-width: 80ch; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---- runs ---- */
  .run-head { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .run-head h2 { margin: 0; font-size: 15px; color: var(--text); font-weight: 600; }
  .run-head .rule { flex: 1; height: 1px; background: var(--line); min-width: 40px; align-self: center; }
  .run-error { color: var(--bad); }

  /* ---- case card ---- */
  .case { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-bottom: 14px; overflow: hidden; }
  .case.healthy { opacity: .8; }
  .case-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .case-head .target { font-family: var(--mono); font-weight: 600; font-size: 15px; }
  .case-head .fault { color: var(--muted); }
  .sep { color: var(--faint); }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pill.ok, .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.bad, .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .pill.warn, .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .pill.info, .badge.info { color: var(--info); background: var(--info-bg); }
  .pill.violet, .badge.violet { color: var(--violet); background: var(--violet-bg); }
  .pill.muted, .badge.muted { color: var(--muted); background: var(--panel-2); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; font-family: var(--mono); white-space: nowrap; }
  .env { font-size: 11.5px; font-family: var(--mono); padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
  .env.prod { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

  /* stepper */
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); padding: 16px 18px 6px; gap: 0; }
  .step { position: relative; text-align: center; font-size: 12px; color: var(--muted); padding-top: 22px; }
  .step::before {
    content: ""; position: absolute; top: 7px; left: -50%; right: 50%; height: 2px; background: var(--line);
  }
  .step:first-child::before { display: none; }
  .step .node {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--panel); z-index: 1;
  }
  .step.ok .node { background: var(--ok); border-color: var(--ok); }
  .step.bad .node { background: var(--bad); border-color: var(--bad); }
  .step.warn .node { background: var(--warn); border-color: var(--warn); }
  .step.info .node { background: var(--info); border-color: var(--info); }
  .step.violet .node { background: var(--violet); border-color: var(--violet); }
  .step.ok::before, .step.bad::before, .step.warn::before, .step.info::before, .step.violet::before { background: var(--faint); }
  .step.skip { color: var(--faint); }
  .step.skip .node { border-style: dashed; }
  .step.active .node { border-color: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .step.active { color: var(--accent); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
  .step .name { font-weight: 600; color: inherit; }
  .step .sub { display: block; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }

  .case-body { padding: 8px 18px 16px; }

  /* the decision is the headline */
  .decision { margin: 10px 0 14px; padding: 2px 0 2px 16px; border-left: 3px solid var(--accent); }
  .decision .quote { font-size: 17px; line-height: 1.55; margin: 0; }
  .decision .by { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .thinking { display: flex; align-items: center; gap: 10px; color: var(--accent); margin: 12px 0; font-size: 15px; }
  .thinking .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  .thinking .dots span:nth-child(2) { animation-delay: .2s; }
  .thinking .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  .diag { margin: 8px 0 4px; display: flex; flex-direction: column; gap: 4px; }
  .diag li { list-style: none; font-size: 13.5px; color: var(--muted); }
  .diag li::before { content: "▸ "; color: var(--faint); }
  .diag ul { margin: 0; padding: 0; }

  /* before / after proof */
  .proof { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; margin: 14px 0 8px; }
  .side { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--panel-2); min-width: 0; }
  .side.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
  .side.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: var(--ok-bg); }
  .side.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-bg); }
  .side h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; display: flex; justify-content: space-between; gap: 8px; }
  .side.bad h4 { color: var(--bad); }
  .side.ok h4 { color: var(--ok); }
  .side.warn h4 { color: var(--warn); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .side .why { margin-top: 6px; font-size: 12.5px; }
  .arrow { align-self: center; color: var(--faint); font-size: 20px; }
  .proof.single { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
  .side .note { font-size: 12.5px; margin: -2px 0 8px; color: var(--text); }
  .reversal .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--warn); font-weight: 700; margin-right: 2px; }

  /* rollback drawn as a reversal */
  .reversal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  .fp { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
  .fp.struck { text-decoration: line-through; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .fp.back { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .reversal .why { flex-basis: 100%; font-size: 12.5px; }
  .reversal .why code { font-family: var(--mono); color: var(--bad); }

  .closing { margin: 12px 0 0; font-size: 14px; color: var(--muted); }
  .closing b { color: var(--text); font-weight: 600; }

  details.raw { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .ev { display: grid; grid-template-columns: 70px 78px 1fr; gap: 10px; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); }
  .ev .t { color: var(--faint); font-family: var(--mono); }
  .ev .k { font-family: var(--mono); font-weight: 700; font-size: 11px; }
  .ev .m { overflow-wrap: anywhere; }

  .empty { margin: 60px auto; text-align: center; color: var(--muted); max-width: 46ch; }
  .err-banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; background: var(--bad-bg); color: var(--bad); font-size: 13.5px; display: none; }

  @media (max-width: 720px) {
    .tagline { display: none; }
    .steps { padding: 14px 8px 4px; }
    .step .sub { display: none; }
    .step { font-size: 10.5px; }
    .proof { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
    .ev { grid-template-columns: 58px 1fr; }
    .ev .k { grid-column: 2; grid-row: 1; }
    .ev .m { grid-column: 1 / -1; }
    .summary p { font-size: 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9 15.5 2 2 4-4"/>
      </svg>
      CertAgent
    </div>
    <span class="tagline">finds what's wrong, fixes it, proves it — or puts it back</span>
    <span class="spacer"></span>
    <span class="chip" id="model-chip" title="Model runs locally through Ollama">model · local</span>
    <span class="chip"><span class="dot" id="status-dot"></span><span id="status-text">connecting…</span></span>
    <button class="run" id="run-btn" type="button">Run cycle now</button>
  </div>
</header>

<main class="wrap">
  <div class="err-banner" id="err"></div>
  <section id="summary"></section>
  <section id="runs"></section>
</main>

<script>
"use strict";

// ---------- state ----------
const state = {
  events: [],          // every event seen, in seq order
  lastSeq: 0,
  status: { running: false, lastRunId: null, model: "model" },
};

const STEPS = ["Observed", "Diagnosed", "Decided", "Policy", "Applied", "Verified"];

const OUTCOME_TONE = {
  "Fixed": "ok",
  "Rolled back": "warn",
  "Needs approval": "violet",
  "Failed safely": "info",
  "Dry run": "muted",
  "Healthy": "ok",
  "Unresolved": "bad",
};

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function time(ts) {
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

function dateTime(ts) {
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function shortFp(fp) {
  return fp ? fp.slice(0, 12) + "…" : "—";
}

/** "2026-10-31T09:12:00Z" → "Oct 31 09:12 (in 23h 41m)" */
function expiry(notAfter) {
  if (!notAfter) return "—";
  const d = new Date(notAfter);
  const mins = Math.round((d - Date.now()) / 60000);
  const abs = Math.abs(mins);
  const span = abs < 60 ? `${abs}m` : abs < 2880 ? `${Math.floor(abs / 60)}h ${abs % 60}m` : `${Math.floor(abs / 1440)}d`;
  return `${dateTime(d)} (${mins < 0 ? span + " ago" : "in " + span})`;
}

function cn(dn) {
  if (!dn) return "—";
  const m = /CN=([^,]+)/.exec(dn);
  return m ? m[1] : dn;
}

/** Short fault label for the card header, from the scanner's reasons. */
function faultLabel(reasons, level) {
  if (!reasons || !reasons.length) return level === "OK" ? "healthy" : "";
  const r = reasons[0];
  if (r.startsWith("chain does not validate")) return "untrusted issuer";
  if (r.startsWith("weak key")) return "weak key";
  if (r.startsWith("expired")) return "expired";
  if (r.startsWith("expires in")) return r.replace(/ \(.*$/, "");
  if (r.startsWith("not yet valid")) return "not yet valid";
  if (r.startsWith("hostname")) return "hostname mismatch";
  if (r.startsWith("handshake failed")) return "unreachable";
  if (r.startsWith("forbidden signature")) return "weak signature";
  return r;
}

/** Drops the Java exception tail the scanner keeps for the model: "...: SunCertPathBuilderException: ..." */
function humanReason(r) {
  return String(r ?? "").replace(/:\s*\w*(Exception|Error)\b.*$/s, "");
}

function badgeTone(decision) {
  return decision === "ALLOW" ? "ok" : decision === "DRY_RUN" ? "muted" : "violet";
}

// ---------- grouping ----------
function groupRuns(events) {
  const runs = new Map();
  for (const e of events) {
    if (!runs.has(e.runId)) runs.set(e.runId, { id: e.runId, events: [], cases: new Map(), firstTs: e.ts });
    const run = runs.get(e.runId);
    run.events.push(e);
    if (e.target) {
      if (!run.cases.has(e.target)) run.cases.set(e.target, []);
      run.cases.get(e.target).push(e);
    }
  }
  return [...runs.values()].reverse(); // newest first
}

function buildCase(target, evs) {
  const of = (k) => evs.filter((e) => e.kind === k);
  const first = (k) => evs.find((e) => e.kind === k);
  const last = (k) => { const a = of(k); return a[a.length - 1]; };

  const policies = of("POLICY");
  const change = policies.find((p) => p.details.tool !== "verify_handshake");
  const applies = of("APPLY");
  const installed = applies.find((a) => a.details.changed === true);
  const verifies = of("VERIFY");
  const post = verifies.find((v) => v.details.phase === "after");
  const rollback = last("ROLLBACK");
  const done = last("DONE");
  const scan = first("SCAN");
  const diag = first("DIAGNOSE");

  // Before: what the change tool saw first; else the first handshake check; else the scan.
  let before = applies.find((a) => a.details.before)?.details.before
            || verifies[0]?.details.served
            || (scan ? {
                 ok: diag?.details.level === "OK",
                 issuer: scan.details.issuer, notAfter: scan.details.notAfter, key: scan.details.key,
                 fingerprint: scan.details.fingerprint, reasons: diag?.details.reasons || [] } : null);

  // After: what is served once everything settled.
  let after = null, afterLabel = "After";
  if (rollback) { after = rollback.details.served; afterLabel = "After rollback"; }
  else if (post) { after = post.details.served; afterLabel = "After"; }

  return {
    target, evs, scan, diag, policies, change, applies, installed, verifies, post, rollback, done,
    env: scan?.details.env || change?.details.env || "",
    level: diag?.details.level,
    reasons: diag?.details.reasons || [],
    outcome: done?.details.outcome || done?.message || null,
    decision: change || policies[policies.length - 1] || null,
    planned: !!first("PLAN"),
    errors: of("ERROR"),
    before, after, afterLabel,
  };
}

function stepStates(c, live) {
  const s = STEPS.map(() => ({ cls: "", sub: "" }));
  const healthy = c.level === "OK";

  if (c.scan) s[0] = { cls: "ok", sub: c.scan.details.endpoint || "" };
  if (c.diag) s[1] = { cls: c.level === "OK" ? "ok" : c.level === "WARN" ? "warn" : "bad", sub: c.level };

  if (healthy) {
    for (let i = 2; i < 6; i++) s[i] = { cls: "skip", sub: "not needed" };
    return s;
  }

  // Verifying is evidence-gathering, not a decision: until a change tool is chosen, a live case is still deciding.
  if (c.change) s[2] = { cls: "info", sub: c.change.details.tool };
  else if (live) s[2] = { cls: "active", sub: "reasoning…" };
  else if (c.decision) s[2] = { cls: "info", sub: "verify only" };

  if (c.change) {
    const d = c.change.details.decision;
    s[3] = { cls: d === "ALLOW" ? "ok" : d === "DRY_RUN" ? "skip" : "violet", sub: c.change.details.badge };
  } else if (c.done) s[3] = { cls: "skip", sub: "no change" };

  const denied = c.change && c.change.details.decision !== "ALLOW";
  if (c.rollback) s[4] = { cls: "warn", sub: "reverted" };
  else if (c.installed) s[4] = { cls: "ok", sub: "installed" };
  else if (c.applies.length) s[4] = { cls: "info", sub: "nothing changed" };
  else if (denied || c.done) s[4] = { cls: "skip", sub: denied ? "blocked" : "—" };

  if (c.rollback) s[5] = { cls: c.rollback.details.servesBackup ? "warn" : "bad", sub: c.rollback.details.servesBackup ? "backup served" : "check" };
  else if (c.post) s[5] = { cls: c.post.details.ok ? "ok" : "bad", sub: c.post.details.ok ? "handshake OK" : "failed" };
  else if (c.done) s[5] = { cls: "skip", sub: "—" };

  if (live && !s.some((x) => x.cls === "active")) { // pulse the first step still waiting
    const i = s.findIndex((x) => x.cls === "");
    if (i >= 0) s[i] = { cls: "active", sub: i === 2 ? "reasoning…" : "working…" };
  }
  return s;
}

// ---------- rendering ----------
/** Red if the handshake fails, amber if it passes with warnings (e.g. inside the renew window), else green. */
function snapTone(snap) {
  if (!snap) return "";
  return !snap.ok ? "bad" : (snap.reasons || []).length ? "warn" : "ok";
}

function renderSide(title, snap, tone, note) {
  if (!snap) return "";
  const reasons = (snap.reasons || []).slice(0, 2).map(humanReason);
  return `
    <div class="side ${tone}">
      <h4><span>${esc(title)}</span><span>${snap.ok ? "handshake OK" : "handshake FAIL"}</span></h4>
      ${note ? `<div class="note">${esc(note)}</div>` : ""}
      <dl class="kv">
        <dt>issuer</dt><dd>${esc(cn(snap.issuer))}</dd>
        <dt>key</dt><dd>${esc(snap.key || "—")}</dd>
        <dt>expires</dt><dd>${esc(expiry(snap.notAfter))}</dd>
        <dt>sha256</dt><dd>${esc(shortFp(snap.fingerprint))}</dd>
      </dl>
      ${reasons.length ? `<div class="why">${reasons.map(esc).join("<br>")}</div>` : ""}
    </div>`;
}

function renderCase(c, live) {
  const steps = stepStates(c, live);
  const tone = OUTCOME_TONE[c.outcome] || "muted";
  const healthy = c.level === "OK";

  let body = "";
  if (!healthy) {
    const denied = c.change && c.change.details.decision !== "ALLOW";
    const hasProof = !!c.after || denied;
    // What it saw — the Before panel repeats this once there is one, so only list it until then.
    if (c.reasons.length && !hasProof) {
      body += `<div class="diag"><ul>${c.reasons.map((r) => `<li>${esc(humanReason(r))}</li>`).join("")}</ul></div>`;
    }
    // What it decided and why — the headline
    if (c.decision && c.decision.details.reasoning) {
      body += `
        <div class="decision">
          <p class="quote">${esc(c.decision.details.reasoning)}</p>
          <div class="by">
            <span>${esc(state.status.model)}</span><span class="sep">→</span>
            <span class="mono">${esc(c.decision.details.tool)}</span>
            <span class="badge ${badgeTone(c.decision.details.decision)}">${esc(c.decision.details.badge)}</span>
          </div>
        </div>`;
    }
    if (live) {
      body += `<div class="thinking"><span class="dots"><span></span><span></span><span></span></span>${esc(state.status.model)} is reasoning…</div>`;
    }
    // What it proved
    if (c.after) {
      const afterTone = c.rollback ? (c.rollback.details.servesBackup ? "warn" : "bad") : snapTone(c.after);
      const same = c.rollback && c.before && c.after.fingerprint === c.before.fingerprint;
      body += `<div class="proof">
        ${renderSide("Before", c.before, snapTone(c.before))}
        <div class="arrow">→</div>
        ${renderSide(c.afterLabel, c.after, afterTone,
            same ? "Same certificate as before the change — the site stayed up on it." : "")}
      </div>`;
    } else if (denied) {
      body += `<div class="proof single">${renderSide("Current — left unchanged", c.before, snapTone(c.before))}</div>`;
    }
    if (c.rollback) {
      const newFp = c.installed?.details.newFingerprint;
      body += `
        <div class="reversal">
          <span class="label">Rollback</span>
          <span class="fp">${esc(shortFp(c.before?.fingerprint))}</span><span>→</span>
          <span class="fp struck" title="new certificate, rejected">${esc(shortFp(newFp))}</span>
          <span>↩</span>
          <span class="fp back" title="restored from backup ${esc(c.rollback.details.backupId)}">${esc(shortFp(c.rollback.details.backupFingerprint))} restored</span>
          <span class="why">Why: <code>${esc(c.rollback.details.reason)}</code></span>
        </div>`;
    }
    const failedSafe = c.applies.find((a) => a.details.changed === false);
    if (failedSafe) {
      body += `<div class="reversal"><span class="why">Stopped before any change: <code>${esc(failedSafe.details.error)}</code></span></div>`;
    }
    if (c.done && c.done.details.summary) {
      body += `<p class="closing"><b>${esc(state.status.model)}:</b> ${esc(c.done.details.summary)}</p>`;
    }
  }

  body += `
    <details class="raw">
      <summary>${c.evs.length} events</summary>
      ${c.evs.map((e) => `
        <div class="ev"><span class="t">${esc(time(e.ts))}</span><span class="k">${esc(e.kind)}</span><span class="m">${esc(e.message)}</span></div>`).join("")}
    </details>`;

  return `
    <article class="case ${healthy ? "healthy" : ""}">
      <div class="case-head">
        <span class="target">${esc(c.target)}</span>
        <span class="env ${c.env === "prod" ? "prod" : ""}">${esc(c.env)}</span>
        <span class="sep">·</span>
        <span class="fault">${esc(faultLabel(c.reasons, c.level))}</span>
        <span class="spacer"></span>
        ${c.outcome ? `<span class="pill ${tone}">${esc(c.outcome)}</span>` : live ? `<span class="pill info">In progress</span>` : ""}
      </div>
      <div class="steps">
        ${steps.map((s, i) => `
          <div class="step ${s.cls}">
            <span class="node"></span>
            <span class="name">${STEPS[i]}</span>
            <span class="sub" title="${esc(s.sub)}">${esc(s.sub)}</span>
          </div>`).join("")}
      </div>
      <div class="case-body">${body}</div>
    </article>`;
}

function renderSummary(runs) {
  const latest = runs[0];
  if (!latest) { $("summary").innerHTML = ""; return; }
  const done = latest.events.filter((e) => !e.target && e.kind === "DONE").pop();
  const running = state.status.running && state.status.lastRunId === latest.id;
  const counts = done?.details.counts || {};
  $("summary").innerHTML = `
    <div class="summary">
      <div class="label">
        <span>${running ? "Run in progress" : "Latest run"}</span>
        <span class="mono">${esc(latest.id)}</span>
        <span>${esc(dateTime(latest.firstTs))}</span>
        ${done?.details.summaryBy ? `<span class="by">summary by ${esc(done.details.summaryBy)}</span>` : ""}
      </div>
      <p>${done ? esc(done.details.summary || done.message)
                : running ? "Scanning targets and working through each case…" : "This run ended without a summary."}</p>
      <div class="counts">
        ${Object.entries(counts).map(([k, v]) => `<span class="pill ${OUTCOME_TONE[k] || "muted"}">${v} · ${esc(k)}</span>`).join("")}
      </div>
    </div>`;
}

function render() {
  const runs = groupRuns(state.events);
  if (!runs.length) {
    $("summary").innerHTML = "";
    $("runs").innerHTML = `<div class="empty">No runs yet. Start one with <b>Run cycle now</b>, or wait for the daily schedule.</div>`;
    return;
  }
  renderSummary(runs);
  $("runs").innerHTML = runs.map((run) => {
    const live = state.status.running && state.status.lastRunId === run.id;
    const done = run.events.filter((e) => !e.target && e.kind === "DONE").pop();
    const err = run.events.filter((e) => !e.target && e.kind === "ERROR").pop();
    const cases = [...run.cases.entries()].map(([t, evs]) => buildCase(t, evs));
    return `
      <div class="run-head">
        <h2>${esc(dateTime(run.firstTs))}</h2>
        <span class="mono">${esc(run.id)}</span>
        ${err ? `<span class="run-error">${esc(err.message)}</span>` : ""}
        <span class="rule"></span>
        <span>${cases.length} target${cases.length === 1 ? "" : "s"}${done ? "" : live ? " · running" : ""}</span>
      </div>
      ${cases.map((c) => renderCase(c, live && !c.done)).join("")}`;
  }).join("");
}

// ---------- data ----------
async function pollEvents() {
  try {
    const res = await fetch(`/api/events?since=${state.lastSeq}`);
    if (!res.ok) throw new Error(`events ${res.status}`);
    const fresh = await res.json();
    if (fresh.length) {
      state.events.push(...fresh);
      state.lastSeq = fresh[fresh.length - 1].seq;
      render();
    }
    $("err").style.display = "none";
  } catch (e) {
    $("err").textContent = "Lost contact with the agent (" + e.message + "). Retrying…";
    $("err").style.display = "block";
  }
}

async function pollStatus() {
  try {
    const res = await fetch("/api/status");
    const s = await res.json();
    const changed = s.running !== state.status.running || s.lastRunId !== state.status.lastRunId;
    state.status = { ...state.status, ...s };
    $("model-chip").textContent = `${s.model} · local`;
    $("model-chip").title = "Decisions: " + s.model + " on this machine (Ollama). Run summaries: " + (s.summaryModel || s.model) + ".";
    $("status-dot").className = "dot" + (s.running ? " live" : "");
    $("status-text").textContent = s.running ? "running" : "idle";
    $("run-btn").disabled = s.running;
    if (changed) render();
  } catch (_) {
    $("status-text").textContent = "offline";
    $("status-dot").className = "dot";
  }
}

$("run-btn").addEventListener("click", async () => {
  $("run-btn").disabled = true;
  await fetch("/api/run", { method: "POST" });
  await pollStatus();
  await pollEvents();
});

(async function start() {
  await pollStatus();
  await pollEvents();
  render();
  setInterval(pollEvents, 1500);
  setInterval(pollStatus, 2000);
})();
</script>
</body>
</html>
